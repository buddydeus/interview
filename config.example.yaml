# 面试副驾 配置文件
# 复制为 config.yaml 后修改。config.yaml 已被 .gitignore 忽略，不会外泄。

audio:
  # 留空 = 自动。启动时会逐个试听所有 loopback 设备，锁定真正在出声的那个。
  # 这一步很关键：如果默认扬声器是显示器（HDMI/DP 音频）而人戴着耳机听，
  # 抓默认扬声器会永远抓不到声音。想固定设备就用 `run.py --list-devices` 拿 id 填这里。
  device: ""
  # 「按住说话」用的麦克风（你自己说话）。留空 = 系统默认输入设备。
  # 和上面的 device 是两类设备：device 抓的是系统输出（面试官的声音），
  # 这里抓的是麦克风（你的声音）。想固定就用 `run.py --check` 看设备名。
  mic_device: ""
  samplerate: 0          # 0 = 自动（优先 16k，失败则退回设备原生采样率）
  block_ms: 30
  noise_ratio: 2.6       # 音量超过噪声底多少倍判定为人声
  min_rms: 0.0035        # 人声绝对音量下限，防止噪声底过低导致误触发
  start_ms: 120          # 连续多久有人声才算一句话开始
  end_silence_ms: 600    # 静音持续多久判定一句话结束
  min_speech_ms: 400     # 短于此时长的片段直接丢弃（咳嗽、键盘声）
  max_speech_ms: 20000   # 超长强制切句。用讯飞时别超过 58000（其单次会话上限 60 秒）
  preroll_ms: 200        # 向前多留一点，避免吃掉句首

asr:
  # 识别引擎：auto / xfyun / local
  #   auto  = 讯飞三件套填齐就走讯飞（在线、免下载模型、延迟低），否则本地 whisper
  #   xfyun = 强制用讯飞（需填下方 app_id / api_key / api_secret）
  #   local = 强制用本地 faster-whisper
  provider: auto

  # ---------- 讯飞（https://www.xfyun.cn）----------
  # 控制台 → 语音听写(流式版) → 获取 APPID / APIKey / APISecret
  # 免费额度足够个人面试使用；断网时 auto 会回退到本地 whisper（若已下载模型）
  xfyun:
    app_id: ""
    api_key: ""
    api_secret: ""
    endpoint: "wss://iat-api.xfyun.cn/v2/iat"
    language: zh_cn      # zh_cn / en_us
    domain: iat          # iat = 日常用语；医疗等场景可换
    accent: mandarin     # mandarin / cantonese
    # 每帧之间等多久再发下一帧。0 = 不等待、全速发送（推荐）。
    # 我们拿到的是完整音频段而非实时流，按 40ms 实时速率发纯属白等：
    # 实测 26s 音频，0ms 用 1.2s 识别完，40ms 要 27s。
    frame_interval_ms: 0
    timeout: 15

  # ---------- 本地 faster-whisper ----------
  # tiny / base / small / medium / large-v3
  # 无独显建议 base 或 small；small 更准但更慢。
  # 也可以直接填一个本地目录路径，跳过下载。
  model: small
  language: zh           # zh / en / auto
  compute_type: int8     # CPU 用 int8；有 N 卡可改 float16
  beam_size: 1
  cpu_threads: 0         # 0 = 自动
  initial_prompt: "以下是中文技术面试的对话，涉及编程、算法、系统设计、项目经历、职业规划。"
  hf_endpoint: "https://hf-mirror.com"   # 模型下载镜像，能直连 HF 可改成 https://huggingface.co

question:
  min_chars: 5           # 短于此长度的句子不判定为问题
  threshold: 3.0         # 疑问句得分阈值，调高更保守（更少误触发）
  merge_gap_ms: 1200     # 两段话间隔小于此时长则合并成一句再判断
  recent_count: 3        # 「问最近」拼接末尾几条字幕，可选 1-8
  auto_answer: true      # 自动识别到问题就生成回答；false 则只提示需手动触发

llm:
  base_url: "https://api.deepseek.com"
  api_key: ""            # 也可用环境变量 OPENAI_API_KEY / DEEPSEEK_API_KEY
  model: deepseek-chat
  temperature: 0.4
  max_tokens: 2000
  # 思考模式。deepseek-v4 系列默认开着思考：先吐几百到几千字思维链再给正文，
  # 面试场景纯属白等，而且思维链会占用 max_tokens，偶尔把正文挤成空。
  # 实测同一组面试题：关闭后总耗时 1.3~1.8s，开启时 3.8~9.0s。
  #   off    = 关闭思考（最快，面试推荐）
  #   auto   = 不干预，用服务端默认（开启 / 强度 high）
  #   low / medium / high / max = 开启思考并指定强度
  # 注意：部分第三方网关不认 thinking 字段，换网关后若报 400 就改回 auto。
  thinking: off
  max_chars: 260         # 期望回答字数上限（写进提示词约束）
  timeout: 60
  style: "使用第一人称口语回答，表达沉稳、具体、简洁。围绕目标岗位突出可迁移经验，但不虚构未做过的技术或项目。"
  resume: ""             # 你的简历/背景，越具体回答越贴合
  jd: ""                 # 目标岗位 JD，用来对齐回答重点
  history_rounds: 4      # 携带最近几轮问答作为上下文

ui:
  width: 480
  height: 620
  opacity: 0.95
  font_size: 14
  theme: dark            # dark / light
  exclude_from_capture: true   # 关键：共享屏幕时对方看不到本窗口
  always_on_top: true
  hotkey_toggle: "ctrl+alt+h"  # 显示/隐藏
  hotkey_answer: "n"           # 单键：把最近字幕当问题提问；留空禁用
  hotkey_clear: "m"            # 单键：清空字幕和回答；留空禁用
  hotkey_talk: "space"         # 单键：按住说话，松开结束；留空禁用
  hotkey_listen: "b"           # 单键：开始/停止监听；留空禁用
